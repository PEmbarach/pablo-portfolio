<header class="hero-section">
  <div class="hero-left">
    <div class="avatar">{{ name[0] }}{{ name.split(' ')[1][0] }}</div>
    <div class="hero-info">
      <h1>{{ name }}</h1>
      <p class="role">{{ role }}</p>
      <span class="available-badge">Available for work</span>
    </div>
  </div>
  <div class="hero-right">
    <nav class="nav-links">
      <a (click)="scrollTo('projects')">Projects</a>
      <a (click)="scrollTo('contact')">Contact</a>
    </nav>
    <div class="hero-buttons">
      <ion-button size="small" [href]="githubUrl" target="_blank">GitHub</ion-button>
      <ion-button size="small" fill="outline" [href]="linkedinUrl" target="_blank">LinkedIn</ion-button>
    </div>
  </div>
</header>
